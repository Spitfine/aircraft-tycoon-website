name: Pages CMS — Prepare Development Update Publication

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action payload
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-publication:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dispatched main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Pages CMS promotion payload
        id: payload
        env:
          PAGES_CMS_PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          plan_file="$RUNNER_TEMP/development-update-publication-payload-plan.json"
          node scripts/editorial/development-update-contract.mjs validate-publish --payload-env PAGES_CMS_PAYLOAD > "$plan_file"
          node --input-type=module - "$plan_file" "$GITHUB_OUTPUT" <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const plan = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (plan.validationStatus !== "PASS") {
            throw new Error("Promotion payload plan did not pass strict validation.");
          }
          const outputs = {
            draft_path: plan.draftSourcePath,
            publication_date: plan.publicationDate,
            slug: plan.derivedSlug,
            source_sha: process.env.GITHUB_SHA,
            target_markdown: plan.targetMarkdownPath,
            public_permalink: plan.publicPermalink,
            english_title_b64: Buffer.from(plan.englishTitle, "utf8").toString("base64")
          };
          for (const [name, value] of Object.entries(outputs)) {
            if (/[\r\n\0]/u.test(value)) throw new Error(`Unsafe workflow output: ${name}`);
            appendFileSync(process.argv[3], `${name}=${value}\n`, "utf8");
          }
          NODE

      - name: Verify remote main has not moved
        env:
          DISPATCHED_SHA: ${{ steps.payload.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main
          remote_main="$(git rev-parse origin/main)"
          test "$remote_main" = "$DISPATCHED_SHA"

      - name: Run strict publication validation
        env:
          DRAFT_PATH: ${{ steps.payload.outputs.draft_path }}
          PUBLICATION_DATE: ${{ steps.payload.outputs.publication_date }}
        run: |
          set -euo pipefail
          node scripts/editorial/development-update-contract.mjs validate-publish \
            --draft "$DRAFT_PATH" \
            --publication-date "$PUBLICATION_DATE" \
            > "$RUNNER_TEMP/development-update-publication-strict-plan.json"

      - name: Verify derived publication plan
        env:
          EXPECTED_DRAFT_PATH: ${{ steps.payload.outputs.draft_path }}
          EXPECTED_PUBLICATION_DATE: ${{ steps.payload.outputs.publication_date }}
          EXPECTED_SLUG: ${{ steps.payload.outputs.slug }}
          EXPECTED_TARGET_MARKDOWN: ${{ steps.payload.outputs.target_markdown }}
          EXPECTED_PUBLIC_PERMALINK: ${{ steps.payload.outputs.public_permalink }}
        run: |
          set -euo pipefail
          node --input-type=module - "$RUNNER_TEMP/development-update-publication-strict-plan.json" <<'NODE'
          import { readFileSync } from "node:fs";

          const plan = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const expected = {
            draftSourcePath: process.env.EXPECTED_DRAFT_PATH,
            publicationDate: process.env.EXPECTED_PUBLICATION_DATE,
            derivedSlug: process.env.EXPECTED_SLUG,
            targetMarkdownPath: process.env.EXPECTED_TARGET_MARKDOWN,
            publicPermalink: process.env.EXPECTED_PUBLIC_PERMALINK
          };
          for (const [field, value] of Object.entries(expected)) {
            if (plan[field] !== value) throw new Error(`Derived publication plan changed: ${field}`);
          }
          if (plan.validationStatus !== "PASS") throw new Error("Strict validation failed.");
          NODE

      - name: Verify publication branch is new
        id: publication_branch
        env:
          PUBLICATION_DATE: ${{ steps.payload.outputs.publication_date }}
          SLUG: ${{ steps.payload.outputs.slug }}
        run: |
          set -euo pipefail
          publication_branch="publish/development-update/${PUBLICATION_DATE}-${SLUG}"
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/$publication_branch" > /dev/null
          lookup_status=$?
          set -e
          if [ "$lookup_status" -eq 0 ]; then
            echo "Remote publication branch already exists: $publication_branch" >&2
            exit 1
          fi
          if [ "$lookup_status" -ne 2 ]; then
            echo "Could not safely determine whether the remote publication branch exists." >&2
            exit 1
          fi
          echo "name=$publication_branch" >> "$GITHUB_OUTPUT"

      - name: Create local publication branch
        env:
          PUBLICATION_BRANCH: ${{ steps.publication_branch.outputs.name }}
        run: git switch -c "$PUBLICATION_BRANCH"

      - name: Materialize publication candidate
        env:
          PAGES_CMS_PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          node scripts/editorial/development-update-contract.mjs prepare-publish \
            --payload-env PAGES_CMS_PAYLOAD \
            > "$RUNNER_TEMP/development-update-publication-result.json"

      - name: Verify exact changed-path manifest
        run: |
          set -euo pipefail
          node --input-type=module - \
            "$RUNNER_TEMP/development-update-publication-result.json" \
            "$RUNNER_TEMP/development-update-publication-paths.nul" <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync, writeFileSync } from "node:fs";

          const result = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (result.validationStatus !== "PASS") throw new Error("Materialization did not pass.");
          const expected = [...result.changedPaths].sort();
          if (expected.length === 0 || new Set(expected).size !== expected.length) {
            throw new Error("Changed-path manifest is empty or contains duplicates.");
          }
          const porcelain = execFileSync(
            "git",
            ["status", "--porcelain=v1", "-z", "--untracked-files=all"],
            { encoding: "buffer" }
          );
          const actual = porcelain
            .toString("utf8")
            .split("\0")
            .filter(Boolean)
            .map((record) => record.slice(3))
            .sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Changed paths differ from manifest. Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}.`);
          }
          writeFileSync(process.argv[3], Buffer.from(`${expected.join("\0")}\0`, "utf8"));
          NODE

      - name: Check candidate diff
        run: git diff --check

      - name: Build publication candidate
        run: npm run build

      - name: Verify candidate output
        env:
          PUBLIC_PERMALINK: ${{ steps.payload.outputs.public_permalink }}
        run: |
          set -euo pipefail
          test -f "_site${PUBLIC_PERMALINK}"
          test ! -e _site/editorial-drafts
          test ! -e _site/__draft-media
          test ! -e _site/__editorial-preview

      - name: Stage only manifested paths
        run: |
          set -euo pipefail
          git add --pathspec-from-file="$RUNNER_TEMP/development-update-publication-paths.nul" --pathspec-file-nul
          node --input-type=module - "$RUNNER_TEMP/development-update-publication-paths.nul" <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";

          const expected = readFileSync(process.argv[2])
            .toString("utf8")
            .split("\0")
            .filter(Boolean)
            .sort();
          const staged = execFileSync("git", ["diff", "--cached", "--name-only", "-z"], { encoding: "buffer" })
            .toString("utf8")
            .split("\0")
            .filter(Boolean)
            .sort();
          if (JSON.stringify(staged) !== JSON.stringify(expected)) {
            throw new Error("Staged paths differ from the authorized materialization manifest.");
          }
          NODE
          git diff --cached --stat
          git diff --cached --check

      - name: Commit publication candidate
        env:
          PUBLICATION_DATE: ${{ steps.payload.outputs.publication_date }}
          SLUG: ${{ steps.payload.outputs.slug }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prepare Development Update publication: ${PUBLICATION_DATE}-${SLUG}"

      - name: Push publication branch
        env:
          PUBLICATION_BRANCH: ${{ steps.publication_branch.outputs.name }}
        run: git push --set-upstream origin "$PUBLICATION_BRANCH"

      - name: Create publication Pull Request
        id: publication_pr
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_BRANCH: ${{ steps.publication_branch.outputs.name }}
          SOURCE_DRAFT: ${{ steps.payload.outputs.draft_path }}
          PUBLICATION_DATE: ${{ steps.payload.outputs.publication_date }}
          SLUG: ${{ steps.payload.outputs.slug }}
          ENGLISH_TITLE_B64: ${{ steps.payload.outputs.english_title_b64 }}
        run: |
          set -euo pipefail
          english_title="$(printf '%s' "$ENGLISH_TITLE_B64" | base64 --decode)"
          media_count="$(node --input-type=module - "$RUNNER_TEMP/development-update-publication-result.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const result = JSON.parse(readFileSync(process.argv[2], "utf8"));
          process.stdout.write(String(result.mediaMappings.length));
          NODE
          )"
          pr_body="$RUNNER_TEMP/development-update-publication-pr.md"
          printf '%s\n' \
            "Source draft: \`$SOURCE_DRAFT\`" \
            "Publication date: \`$PUBLICATION_DATE\`" \
            "Derived slug: \`$SLUG\`" \
            "Strict validation: **PASS**" \
            "Promoted media files: **$media_count**" \
            "" \
            "This Pull Request is a publication candidate. Merging it **will make the Development Update public**." \
            "" \
            "Human review is required. No automatic merge is configured." \
            > "$pr_body"
          pr_url="$(gh pr create \
            --base main \
            --head "$PUBLICATION_BRANCH" \
            --title "Prepare Development Update: $english_title" \
            --body-file "$pr_body")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Summarize publication candidate
        env:
          PUBLICATION_BRANCH: ${{ steps.publication_branch.outputs.name }}
          PUBLICATION_PR_URL: ${{ steps.publication_pr.outputs.url }}
          SOURCE_DRAFT: ${{ steps.payload.outputs.draft_path }}
          PUBLICATION_DATE: ${{ steps.payload.outputs.publication_date }}
          SLUG: ${{ steps.payload.outputs.slug }}
        run: |
          {
            echo "## Development Update publication candidate"
            echo
            echo "- Source draft: \`$SOURCE_DRAFT\`"
            echo "- Publication date: \`$PUBLICATION_DATE\`"
            echo "- Derived slug: \`$SLUG\`"
            echo "- Publication branch: \`$PUBLICATION_BRANCH\`"
            echo "- Pull Request: $PUBLICATION_PR_URL"
            echo "- Strict validation: **PASS**"
            echo "- Auto-merge: **DISABLED**"
            echo
            echo "This candidate is not public until a human reviews and merges its Pull Request into \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"
