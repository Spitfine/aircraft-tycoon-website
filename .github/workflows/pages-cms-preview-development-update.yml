name: Pages CMS — Development Update Preview

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action payload as JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  preview:
    name: Build Development Update Preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out dispatched ref
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate payload and build preview
        id: preview
        env:
          PAGES_CMS_PAYLOAD: ${{ inputs.payload }}
        run: node scripts/editorial/development-update-contract.mjs preview --payload-env PAGES_CMS_PAYLOAD

      - name: Verify temporary staging cleanup
        shell: bash
        run: |
          test ! -e "content/development-updates/__editorial-preview-${{ steps.preview.outputs.slug }}.md"
          test ! -e "assets/__editorial-preview"
          test -f "_site${{ steps.preview.outputs.preview_path }}"

      - name: Deploy named editorial preview
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_PLANT_053180010 }}
          action: upload
          app_location: "_site"
          api_location: ""
          output_location: ""
          skip_app_build: true
          deployment_environment: "editorial-preview"

      - name: Write preview summary
        env:
          DRAFT_PATH: ${{ steps.preview.outputs.draft_path }}
          SOURCE_SHA: ${{ steps.preview.outputs.source_sha }}
          PREVIEW_BASE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          PREVIEW_PATH: ${{ steps.preview.outputs.preview_path }}
        shell: bash
        run: |
          article_url="${PREVIEW_BASE_URL%/}${PREVIEW_PATH}"
          printf '## Development Update Preview\n\n- Draft path: `%s`\n- Source SHA: `%s`\n- Preview environment: %s\n- Preview article: %s\n' \
            "$DRAFT_PATH" "$SOURCE_SHA" "$PREVIEW_BASE_URL" "$article_url" >> "$GITHUB_STEP_SUMMARY"
